<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users Directory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons for visual enhancement -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --primary-color: #3b82f6;
            --text-dark: #0f172a;
            --text-muted: #64748b;
        }

        body {
            background: var(--bg-gradient);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            padding-top: 50px;
            padding-bottom: 60px;
            color: #f8fafc;
        }

        /* Header Section */
        .page-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .page-header h1 {
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        .page-header p {
            color: #94a3b8;
            font-size: 1rem;
        }

        /* Grid Row Adjustment */
        #users {
            row-gap: 1.5rem;
        }

        /* Modern Glassmorphic Card */
        .card {
            border: none;
            border-radius: 18px;
            background: var(--card-bg);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            height: 100%;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 35px -10px rgba(59, 130, 246, 0.3);
        }

        .card-body {
            padding: 24px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Top Accent Line */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #3b82f6, #6366f1);
        }

        /* Targeting Generated Paragraphs via nth-child */
        
        /* 1st p: ID (Badge top right) */
        .card-text:nth-child(1) {
            position: absolute;
            top: 18px;
            right: 18px;
            background: #eff6ff;
            color: #2563eb;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            margin: 0;
            border: 1px solid #dbeafe;
        }

        .card-text:nth-child(1)::before {
            content: "ID: ";
        }

        /* 2nd p: Name (Primary Heading) */
        .card-text:nth-child(2) {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-top: 10px;
            margin-bottom: 4px;
            padding-right: 50px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 3rd p: Username */
        .card-text:nth-child(3) {
            font-size: 0.85rem;
            color: #6366f1;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .card-text:nth-child(3)::before {
            content: "@";
        }

        /* 4th p: Email */
        .card-text:nth-child(4) {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            word-break: break-all;
        }

        .card-text:nth-child(4)::before {
            content: "\f0e0";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            color: var(--primary-color);
            width: 16px;
        }

        /* 5th p: City */
        .card-text:nth-child(5) {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-text:nth-child(5)::before {
            content: "\f3c5";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            color: #ef4444;
            width: 16px;
        }

        /* 6th p: Phone */
        .card-text:nth-child(6) {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-text:nth-child(6)::before {
            content: "\f095";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            color: #10b981;
            width: 16px;
        }

        /* 7th p: Zipcode */
        .card-text:nth-child(7) {
            font-size: 0.82rem;
            color: #94a3b8;
            margin-top: auto;
            padding-top: 12px;
            border-top: 1px dashed #e2e8f0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-text:nth-child(7)::before {
            content: "Zipcode: ";
            font-weight: 600;
            color: #64748b;
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- Dashboard Title Header -->
        <div class="page-header">
            <h1 class="display-5">User Management Directory</h1>
            <p>Fetched dynamically from FakeStore API</p>
        </div>

        <!-- Cards Container -->
        <div class="row" id="users"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="user.js"></script>
</body>

</html>
